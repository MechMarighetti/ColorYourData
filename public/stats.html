<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas Globales</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stats-page {
      min-height: 100vh;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f9f0ff, #e2f0cb, #bae1ff);
    }

    .stats-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .stats-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.12);
    }

    .stats-card h1 {
      color: #7b5cff;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 2.2em;
    }

    .stats-card h2 {
      color: #6a5acd;
      font-size: 1.6em;
      margin-top: 30px;
      margin-bottom: 15px;
      border-bottom: 2px solid #ff6f91;
      padding-bottom: 10px;
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-bottom: 40px;
      padding: 20px;
      background: #f9f6ff;
      border-radius: 16px;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-box {
      background: linear-gradient(135deg, #ff6f91, #ffa5d9);
      color: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 111, 145, 0.2);
    }

    .stat-box h3 {
      margin: 0;
      font-size: 0.95em;
      opacity: 0.9;
    }

    .stat-box .value {
      font-size: 2.2em;
      font-weight: 700;
      margin: 10px 0 0 0;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .nav-links a {
      padding: 12px 24px;
      background: #6a5cff;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-weight: 600;
      transition: background 0.3s;
    }

    .nav-links a:hover {
      background: #7b6dff;
    }

    .loading {
      text-align: center;
      color: #6a5acd;
      font-size: 1.1em;
      padding: 40px;
    }

    .error {
      background: #fffbea;
      padding: 30px;
      border-radius: 16px;
      color: #d4a574;
      border-left: 4px solid #ffc3a0;
      text-align: center;
      font-size: 1.05em;
    }

    @media (max-width: 768px) {
      .stats-card {
        padding: 20px;
      }

      .stats-card h1 {
        font-size: 1.8em;
      }

      .stats-card h2 {
        font-size: 1.3em;
      }

      .chart-container {
        height: 250px;
      }

      .stat-box .value {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="stats-page">
    <div class="stats-container">
      <div class="stats-card">
        <h1>📊 Estadísticas Globales</h1>
        
        <div id="content" class="loading">Cargando estadísticas...</div>
        
        <div class="nav-links">
          <a href="index.html">🎨 Volver a la encuesta</a>
          <a href="perfil.html">🔍 Mi huella digital</a>
        </div>
      </div>
    </div>
  </div>

  <script src="stats.js"></script>
</body>
</html>
