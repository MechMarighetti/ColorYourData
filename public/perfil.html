<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Perfil de Color</title>
  <link rel="stylesheet" href="style.css">
  <style>

    body {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    #content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .perfil-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .perfil-grid .section {
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .perfil-grid .section p {
      margin: 0;
    }

    .section--full {
      grid-column: 1 / -1;
      justify-content: flex-start;
    }

    @media (max-width: 600px) {
      .perfil-grid {
        grid-template-columns: 1fr;
      }
    }

    .section {
      background: white;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(123, 92, 255, 0.1);
      border: 1px solid rgba(123, 92, 255, 0.05);
      animation: slideIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section:nth-child(1) { animation-delay: 0.1s; }
    .section:nth-child(2) { animation-delay: 0.2s; }
    .section:nth-child(3) { animation-delay: 0.3s; }
    .section:nth-child(4) { animation-delay: 0.4s; }
    .section:nth-child(5) { animation-delay: 0.5s; }

    .section h2 {
      color: #6a5acd;
      font-size: 1.6em;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-color-row {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .card-color-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .card-color-info p {
      margin: 0;
    }

    .color-preview {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease;
    }

    .color-preview:hover {
      transform: scale(1.05);
    }

    .profile-color-name {
      margin: 4px 0;
      font-weight: 600;
      color: #4a3f72;
    }

    .profile-color-name.secondary {
      font-weight: 400;
      color: #888;
      font-size: 0.95em;
    }

    .profile-color-hex {
      display: inline-block;
      font-size: 0.95em;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 12px;
      border-radius: 999px;
      background: currentColor;
      margin: 4px 0;
    }

    .profile-color-hex span {
      color: white;
      mix-blend-mode: difference;
    }

    .profile-country-text {
      color: #888;
      font-size: 0.95em;
      margin: 4px 0 0;
    }

    .stat-value {
      font-size: 2.2em;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6f91, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      text-align: center;
      line-height: 1.1;
    }

    .interpretation {
      background: linear-gradient(135deg, #f9f0ff, #f0f9ff);
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid #c084fc;
      color: #4a3f72;
      font-size: 1em;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      width: 100%;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e8e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5d90fd, #d388ff, #ff6f91);
      transition: width 0.6s ease;
      border-radius: 10px;
    }

    .heatmap-container {
      display: grid;
      grid-template-columns: repeat(4, 52px);
      gap: 6px;
      margin: 20px auto;
    }

    .heatmap-cell {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }

    .heatmap-cell:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(255, 111, 145, 0.3);
    }

    .heatmap-note {
      text-align: center;
      color: #888;
      font-size: 0.95em;
      font-style: italic;
      margin-top: 16px;
    }

    .no-data {
      text-align: center;
      color: #999;
      font-size: 1.05em;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 12px;
      font-style: italic;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #ffe2e2, #fff0f0);
      border-radius: 20px;
      border: 2px solid #ff6f91;
    }

    .error p {
      font-size: 1.2em;
      color: #6a5acd;
      margin: 12px 0;
    }

    .inline-action-link {
      color: #ff6f91;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.3s;
    }

    .inline-action-link:hover {
      color: #6a5acd;
      text-decoration: underline;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      gap: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(123, 92, 255, 0.2);
      border-top-color: #ff6f91;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .profile-header {
      text-align: center;
      padding: 32px 20px 12px;
      max-width: 1200px;
      margin: 0 auto 12px;
    }

    .profile-header h1 {
      color: #6a5acd;
      font-size: 2.4em;
      margin: 0 0 8px 0;
    }

    .profile-header > p {
      color: #888;
      font-size: 1.1em;
      margin: 0 0 12px 0;
    }

    .profile-header .profile-nav {
      margin: 0;
    }

    @media (max-width: 600px) {
      .profile-header h1 { font-size: 1.8em; }
      .section { padding: 20px; }
      .stat-value { font-size: 1.6em; }
    }
  </style>
</head>
<body>
  <div class="profile-header">
    <h1>🎨 Tu Perfil Colorido</h1>
    <p>Descubre tu huella de color en esta encuesta</p>
    <nav class="profile-nav" aria-label="Navegación principal">
      <a class="nav-link" href="index.html">🏠 Inicio</a>
      <a class="nav-link" href="huella.html">🔍 Mi huella</a>
      <a class="nav-link" href="stats.html">📊 Estadísticas</a>
      <a class="nav-link" href="transparencia.html">📋 Transparencia</a>
    </nav>
  </div>

  <div id="content" class="loading">
    <div class="spinner"></div>
    <span>Cargando tu perfil...</span>
  </div>

  <script type="module" src="perfil.js"></script>
</body>
</html>
