<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Colores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="warning-modal" class="modal-overlay" style="display: none;">
    <div class="modal-warning">
      <div class="modal-header">
        <h2>⚠️ Datos Recolectados</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-content"></div>
      <button class="modal-btn">Entendido</button>
    </div>
  </div>
  <div class="timeline-page">
    <div class="timeline-card">
      <h1>🌈 Tus colores en el tiempo ✨</h1>
      <p class="timeline-intro">Descubre cómo han evolucionado tus elecciones de color a lo largo del tiempo. Cada punto representa una decisión única en tu sesión. 🎨</p>
      <div id="session-info" class="session-info"></div>
      <div id="timeline" class="timeline-container">
        <div class="timeline-line"></div>
      </div>
      <div id="ip-group" class="ip-group"></div>
      <p class="timeline-footer">
        <a href="index.html">⬅️ Elegí otro color</a>
        <span class="timeline-link-separator">•</span>
        <a href="stats.html">Chusmeá las estadísticas 📊</a>
      </p>
    </div>
  </div>
  <script src="timeline.js"></script>
</body>
</html>
